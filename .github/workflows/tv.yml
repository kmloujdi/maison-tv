name: Programme TV du soir
on:
  schedule:
    - cron: "15 4 * * *"   # chaque jour vers 5 h 15 / 6 h 15 (heure de Paris)
    - cron: "15 13 * * *"  # mise à jour l'après-midi
  workflow_dispatch: {}     # bouton « Run workflow » pour lancer à la main
permissions:
  contents: write
jobs:
  tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tv.py
      - name: Enregistrer tv.json
        run: |
          git config user.name "maison-bot"
          git config user.email "maison-bot@users.noreply.github.com"
          git add tv.json
          git diff --cached --quiet || git commit -m "Programme TV du $(date +%F)"
          git push
